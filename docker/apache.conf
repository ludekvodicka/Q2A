ServerName localhost
ServerTokens Prod
ServerSignature Off
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

<DirectoryMatch "/(vendor|docker|docs|\.git|\.aidocs|\.checkpoints)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(composer\.(json|lock|phar)|qa-config.*\.php)$">
    Require all denied
</FilesMatch>

<DirectoryMatch "/var/www/html/(qa-uploads|upfiles)(/|$)">
    php_admin_flag engine off
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>
